name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Required gate: GDScript style + static lint on OUR code.
  # Reused rig (Vehicle_System), third-party addons, and the water sample are
  # excluded so we don't churn on code we didn't author. Widen later as desired.
  # ---------------------------------------------------------------------------
  lint:
    name: GDScript lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit>=4,<5"

      - name: Collect project GDScript
        id: collect
        run: |
          files=$(git ls-files '*.gd' \
            ':!:addons/**' \
            ':!:Vehicle_System/**' \
            ':!:godot-realistic-water-master/**')
          # Save (newline-delimited) for later steps.
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No project-authored GDScript to check yet (only reused/third-party code present)."
          else
            echo "Will check:"; echo "$files"
          fi

      - name: gdformat --check
        if: steps.collect.outputs.files != ''
        run: echo "${{ steps.collect.outputs.files }}" | xargs gdformat --check

      - name: gdlint
        if: steps.collect.outputs.files != ''
        run: echo "${{ steps.collect.outputs.files }}" | xargs gdlint

  # ---------------------------------------------------------------------------
  # Non-blocking (for now): open the project headless so a broken scene/script
  # reference fails CI instead of surprising us at runtime. Flip continue-on-error
  # off once we've confirmed one green run.
  # ---------------------------------------------------------------------------
  import:
    name: Godot headless import
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GODOT_VERSION: "4.6.0"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up Godot (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true

      - name: Import project (headless)
        run: |
          set -o pipefail
          godot --headless --import --verbose 2>&1 | tee import.log || true
          echo "----- scanning import log for hard errors -----"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|Can't open" import.log; then
            echo "::error::Project failed to import cleanly."
            exit 1
          fi
          echo "Import completed without hard errors."
